name: Deploy backend (reusable)

# Puts one container image on the Web App, proves it is the one answering and working, and puts the last good image back if it is
# not. Called by deploy.yml (after a push to main has passed the CI gates and the image is published) and by redeploy-backend.yml
# (to roll forward or back to any published image by hand). Not run on its own.
#
# How it deploys, and why it needs no Azure login: the Web App is configured ONCE (in the portal) to run the moving tag
#     ghcr.io/<owner>/saharvest-api:live
# A deployment repoints `live` at the new image (pull, tag, push: the very same manifest, so the very same bytes) and then POSTs the Web App's own
# "webhook" URL, which makes App Service restart the container and pull `live` again (Microsoft's documented way to deploy from
# a registry that is not ACR or Docker Hub). The only credential is that webhook URL, stored as one environment secret; it carries
# the Web App's deployment credentials, so it can never be anything but a secret of the `production` environment, which only `main` can use.
# (The Microsoft Entra / OIDC alternative, for a tenant that allows app registrations, is kept in infra/alternatives/.)
#
# After the switch the smoke test waits until /api/health reports the NEW commit's revision (so the previous container still
# answering is not a pass), then checks sign-in rules. On success the image is also tagged `last-good`; on failure `live` is pointed
# back at `last-good` and the webhook is called again. No slots on the free tier, so there is a short gap while the container restarts.
on:
  workflow_call:
    inputs:
      image:
        description: "Full image reference to deploy, ending in the 12-character revision tag, e.g. ghcr.io/owner/saharvest-api:REVISION"
        required: true
        type: string
      environment:
        description: "GitHub environment holding the secret and variables"
        required: false
        type: string
        default: production

permissions:
  contents: read
  packages: write # to repoint the `live` and `last-good` tags with the workflow's own token

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    env:
      IMAGE: ${{ inputs.image }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      WEBHOOK_URL: ${{ secrets.AZURE_WEBAPP_WEBHOOK_URL }}

    steps:
    - uses: actions/checkout@v4

    - name: Check the deployment is configured
      run: |
        missing=""
        [ -n "$API_BASE_URL" ] || missing="$missing variable:API_BASE_URL"
        [ -n "$WEBHOOK_URL" ]  || missing="$missing secret:AZURE_WEBAPP_WEBHOOK_URL"
        if [ -n "$missing" ]; then
          echo "::error::Missing for environment '${{ inputs.environment }}':$missing (see the setup guide)"
          exit 1
        fi
        case "$IMAGE" in *:*) ;; *) echo "::error::'$IMAGE' has no tag"; exit 1 ;; esac

    - name: Work out the image names
      run: |
        repo="${IMAGE%:*}"            # ghcr.io/owner/saharvest-api
        revision="${IMAGE##*:}"       # the first 12 characters of the commit
        {
          echo "REVISION=$revision"
          echo "LIVE=$repo:live"
          echo "LAST_GOOD=$repo:last-good"
        } >> "$GITHUB_ENV"
        echo "Deploying revision $revision ($IMAGE)"

    - name: Sign in to the registry
      env:
        REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

    # Is there a last good image to go back to? The first deployment has none.
    - name: Remember whether there is a last good image
      run: |
        if docker buildx imagetools inspect "$LAST_GOOD" > /dev/null 2>&1; then
          echo "HAS_LAST_GOOD=true" >> "$GITHUB_ENV"
          echo "Last good image exists: a failed deployment can be rolled back."
        else
          echo "HAS_LAST_GOOD=false" >> "$GITHUB_ENV"
          echo "::notice::No last-good image yet (first deployment): there is nothing to roll back to."
        fi

    - name: Point "live" at the new image and tell Azure to pull it
      run: |
        echo "DEPLOY_STARTED=true" >> "$GITHUB_ENV" # from here on a failure must put the last good image back
        docker pull --quiet "$IMAGE"
        docker tag "$IMAGE" "$LIVE"
        docker push --quiet "$LIVE"
        # -f: fail on 401/403 (basic-auth publishing credentials switched off, or a wrong URL); --max-time: never hang the pipeline.
        curl -fsS --max-time 60 -X POST "$WEBHOOK_URL" > /dev/null
        echo "The Web App was told to restart and pull ${LIVE}."

    - name: Smoke test (waits for the new revision)
      env:
        EXPECTED_REVISION: ${{ env.REVISION }}
        SMOKE_USERNAME: ${{ secrets.SMOKE_TEST_USERNAME }}
        SMOKE_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
      run: bash .github/scripts/smoke-test.sh "${API_BASE_URL%/}"

    - name: Remember this image as the last good one
      run: |
        docker tag "$IMAGE" "$LAST_GOOD" # the image pulled above: same manifest, so the same bytes
        docker push --quiet "$LAST_GOOD"
        {
          echo "### Deployed"
          echo "Revision \`$REVISION\` is live on the Web App and passed the smoke test."
        } >> "$GITHUB_STEP_SUMMARY"

    # Only once `live` has been repointed: a failure earlier (not configured, registry login) changed nothing to undo.
    - name: Roll back to the last good image
      if: failure() && env.DEPLOY_STARTED == 'true' && env.HAS_LAST_GOOD == 'true'
      run: |
        echo "::warning::Deployment of $REVISION failed; putting the last good image back."
        docker pull --quiet "$LAST_GOOD"
        docker tag "$LAST_GOOD" "$LIVE"
        docker push --quiet "$LIVE"
        curl -fsS --max-time 60 -X POST "$WEBHOOK_URL" > /dev/null
        {
          echo "### Rolled back"
          echo "Revision \`$REVISION\` failed its checks, so \`live\` was pointed back at the last good image. Read the failing step above."
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Note that there was nothing to roll back to
      if: failure() && env.DEPLOY_STARTED == 'true' && env.HAS_LAST_GOOD == 'false'
      run: |
        {
          echo "### Not rolled back"
          echo "This was the first deployment, so there was no last good image. Fix the cause (the failing step above, and the Log stream in the portal), then run **Redeploy backend** with tag \`$REVISION\`."
        } >> "$GITHUB_STEP_SUMMARY"
