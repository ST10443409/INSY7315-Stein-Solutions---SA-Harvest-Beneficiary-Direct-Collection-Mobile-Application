name: Backend CD (Docker Build)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Backend-ASPNET/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend-ASPNET

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore BeneficiaryBackend.sln
      
    - name: Build
      run: dotnet build BeneficiaryBackend.sln --no-restore --configuration Release
      
    - name: Build Docker Image
      run: docker build -t beneficiary-backend:latest .
      
    # Note: Append Docker login and push commands here based on your target 
    # registry (e.g., Azure Container Registry, AWS ECR, or Docker Hub).