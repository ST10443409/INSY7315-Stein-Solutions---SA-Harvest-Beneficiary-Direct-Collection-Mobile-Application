name: Backend CI/CD (Build, Test, Docker)

# Runs for pull requests and pushes on `development` and `main`, but the build only does its work when backend code (or this
# workflow) changed; Android-only changes skip it. The filter is a job (not `paths:` on the trigger) so that this workflow
# always reports a result, which branch protection needs: see .github/scripts/changed-paths.sh.
# The two Room-related paths are here on purpose: api.Tests (RoomParityTests) reads the Kotlin entities
# and UserRole.kt to make sure the backend models stay in sync with the app.
on:
  pull_request:
    branches: [ "main", "development" ]
  push:
    branches: [ "main", "development" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.relevant }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # a diff against the base needs the history

    - name: Did backend code change?
      id: filter
      env:
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_AFTER: ${{ github.sha }}
      run: |
        relevant=$(bash .github/scripts/changed-paths.sh '^(api/|api\.Tests/|external-api-sim/|compose\.yaml$|dotnet-tools\.json$|client/app/src/main/java/com/example/client/data/|client/app/src/main/java/com/example/client/auth/UserRole\.kt$|\.github/workflows/cd-backend\.yml$|\.github/scripts/changed-paths\.sh$)')
        echo "Backend relevant: $relevant"
        echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  # Keep this job's name: it is the check name branch protection requires. A skipped job counts as passed.
  build-test-docker:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A throwaway PostgreSQL for the few tests that need a real one (PostgresClaimAndMigrationTests): that every migration
    # applies to an empty database with the model matching it, and that the Foodspace forwarding claim holds under real SQL.
    # Trust authentication because it lives only for this job on the runner and holds no data worth a password.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
    - uses: actions/checkout@v4

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: |
        dotnet restore api.Tests/api.Tests.csproj
        dotnet restore external-api-sim/external-api-sim.csproj

    - name: Build
      run: |
        dotnet build api.Tests/api.Tests.csproj --no-restore --configuration Release
        dotnet build external-api-sim/external-api-sim.csproj --no-restore --configuration Release

    # Most of api.Tests boots the real API in memory (in-memory database, test-only JWT settings) and needs no database and
    # no secrets. TEST_POSTGRES switches on the tests that use the PostgreSQL service above; without it they are skipped.
    - name: Test
      env:
        TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Database=postgres
      run: dotnet test api.Tests/api.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory ./test-results

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-test-results
        path: test-results/
        if-no-files-found: ignore
        retention-days: 7

    # Only proves the images build. Add registry login + push steps here when a deploy target exists
    # (see CONTRIBUTING.md for the secrets that will need).
    - name: Build API Docker image
      run: docker build -t saharvest-api:ci ./api

    - name: Build external API simulator Docker image
      run: docker build -t saharvest-external-api-sim:ci ./external-api-sim
