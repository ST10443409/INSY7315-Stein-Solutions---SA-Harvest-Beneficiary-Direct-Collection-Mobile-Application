name: Android CI

# Runs for pull requests into `development` and `main` and pushes to `development`, but the build only does its work when the
# Android project (or this workflow) changed; backend-only changes skip it. The filter is a job (not `paths:` on the trigger)
# so that this workflow always reports a result, which branch protection needs: see .github/scripts/changed-paths.sh.
#
# Two tiers (design document B10.4): build, lint and unit tests run everywhere; the emulator (instrumented) tests, which
# take most of the hour, run only for work heading into `main` and on `main` itself, so day-to-day pull requests into
# `development` stay fast and do not use up the free Actions minutes.
#
# A push to `main` is NOT a trigger of its own: deploy.yml calls this workflow (workflow_call), so the commit that ships went
# through the same sequence a pull request does, and the release job can read `android_changed`. Inside that call
# github.event_name and github.ref are the caller's (push, refs/heads/main), so the emulator tests do run.
on:
  pull_request:
    branches: [ "main", "development" ]
  push:
    branches: [ "development" ]
  workflow_dispatch:
  workflow_call:
    outputs:
      android_changed:
        description: "'true' when this change touched the Android project, so a release APK should be built"
        value: ${{ jobs.changes.outputs.android }}

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # True for a pull request into main, a push to main, and a manual run.
  RUN_EMULATOR_TESTS: ${{ github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || github.ref == 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.filter.outputs.relevant }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # a diff against the base needs the history

    - name: Did the Android project change?
      id: filter
      env:
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_AFTER: ${{ github.sha }}
      run: |
        relevant=$(bash .github/scripts/changed-paths.sh '^(client/|\.github/workflows/ci-android\.yml$|\.github/scripts/changed-paths\.sh$)')
        echo "Android relevant: $relevant"
        echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  # Keep this job's name: it is the check name branch protection requires. A skipped job counts as passed.
  build:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ./client

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle (wrapper + dependency cache)
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # gradle.properties is sized for a 32 GB dev machine (4g Gradle + 3g Kotlin daemon); a standard
    # hosted runner has ~7 GB, so cap both here to avoid the runner killing the build.
    - name: Build, lint and unit-test
      run: >
        ./gradlew assembleDebug lint testDebugUnitTest --stacktrace
        -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
        -Pkotlin.daemon.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=768m"

    # #59: the release variant (R8 shrinking and obfuscation on, lintVitalRelease included) must keep building, so a keep-rule
    # or signing-config mistake fails the pull request instead of surprising the release. Unsigned and pointed at a dummy
    # https address on purpose: no secret is needed or used here. The signed build is the release pipeline's job.
    - name: Release build check (R8, unsigned)
      run: >
        ./gradlew assembleRelease -PapiBaseUrl=https://api.example.test/ --stacktrace
        -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
        -Pkotlin.daemon.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=768m"

    - name: Enable KVM for Android Emulator
      if: env.RUN_EMULATOR_TESTS == 'true'
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # The emulator refuses to start unless the disk has 1.2x its data partition free. With the default 6 GB partition that
    # is 7.4 GB, more than the hosted runner has left after the build (about 6.7 GB), so it never booted. Remove
    # toolchains this job never uses (the Android SDK and Java are left alone) and give the AVD a smaller partition below.
    - name: Free disk space for the emulator
      if: env.RUN_EMULATOR_TESTS == 'true'
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL \
          /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules
        df -h /

    - name: Run Instrumented Tests
      if: env.RUN_EMULATOR_TESTS == 'true'
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 31
        target: google_apis
        arch: x86_64
        # Plenty for the app and its tests, and needs about 4.9 GB free instead of 7.4 GB (see the step above).
        disk-size: 4G
        force-avd-creation: false
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: cd client && ./gradlew connectedDebugAndroidTest --stacktrace -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=768m"

    - name: Upload lint and test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-reports
        path: |
          client/app/build/reports/lint-results-*.html
          client/app/build/reports/tests/
          client/app/build/reports/androidTests/
        if-no-files-found: ignore
        retention-days: 7
