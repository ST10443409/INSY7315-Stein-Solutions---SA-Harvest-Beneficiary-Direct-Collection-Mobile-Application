name: Android CI

# Runs only when the Android project (or this workflow) changes; backend-only changes don't trigger it.
on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'client/**'
      - '.github/workflows/ci-android.yml'
  push:
    branches: [ "main" ]
    paths:
      - 'client/**'
      - '.github/workflows/ci-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ./client

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle (wrapper + dependency cache)
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # gradle.properties is sized for a 32 GB dev machine (4g Gradle + 3g Kotlin daemon); a standard
    # hosted runner has ~7 GB, so cap both here to avoid the runner killing the build.
    - name: Build, lint and unit-test
      run: >
        ./gradlew assembleDebug lint testDebugUnitTest --stacktrace
        -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
        -Pkotlin.daemon.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=768m"

    - name: Enable KVM for Android Emulator
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run Instrumented Tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 31
        target: google_apis
        arch: x86_64
        force-avd-creation: false
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: cd client && ./gradlew connectedDebugAndroidTest --stacktrace -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=768m"

    - name: Upload lint and test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-reports
        path: |
          client/app/build/reports/lint-results-*.html
          client/app/build/reports/tests/
          client/app/build/reports/androidTests/
        if-no-files-found: ignore
        retention-days: 7
