name: Android CI

# Runs only when the Android project (or this workflow) changes; backend-only changes don't trigger it.
on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'client/**'
      - '.github/workflows/ci-android.yml'
  push:
    branches: [ "main" ]
    paths:
      - 'client/**'
      - '.github/workflows/ci-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./client

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle (wrapper + dependency cache)
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # gradle.properties is sized for a 32 GB dev machine (4g Gradle + 3g Kotlin daemon); a standard
    # hosted runner has ~7 GB, so cap both here to avoid the runner killing the build.
    - name: Build, lint and unit-test
      run: >
        ./gradlew assembleDebug lint test --stacktrace
        -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
        -Pkotlin.daemon.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=768m"

    - name: Upload lint and test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-reports
        path: |
          client/app/build/reports/lint-results-*.html
          client/app/build/reports/tests/
        if-no-files-found: ignore
        retention-days: 7
