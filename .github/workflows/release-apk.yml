name: Release APK

# Publishes the signed Android APK as a GitHub Release. Push a version tag from main and this does the rest:
#
#   git checkout main && git pull
#   git tag v1.0.0 && git push origin v1.0.0
#
# It does not re-run the test suites: a tag is only accepted if its commit is on `main`, and everything on `main` has already
# passed the same gates in deploy.yml. The signing secrets and API_BASE_URL are the ones deploy.yml uses (production
# environment). Steps and checks: docs/android-release.md, "Publishing a release".
on:
  push:
    tags: [ "v[0-9]+.[0-9]+.[0-9]+" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v1.0.0"
        required: true

permissions:
  contents: write # create the release and attach files to it

concurrency:
  group: release-apk-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production # where the signing secrets and API_BASE_URL live
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.tag || github.ref }}
        fetch-depth: 0 # needed to check the tag is on main

    - name: Check the tag
      id: version
      run: |
        if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
          echo "::error::'$TAG' is not a version tag like v1.0.0"; exit 1
        fi
        git fetch origin main
        if ! git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main; then
          echo "::error::$TAG is not on main. Release only what has been merged and deployed."; exit 1
        fi
        major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
        # versionCode must rise with every APK that reaches a phone. Derived from the tag, so a higher tag is always a higher code
        # (v1.0.0 = 10000, v1.0.1 = 10001, v1.2.0 = 10200), and always above the small run-number codes deploy.yml's artifacts use.
        echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
        echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"

    - name: Is release signing configured?
      env:
        KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        API_BASE_URL: ${{ vars.API_BASE_URL }}
      run: |
        missing=""
        for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD API_BASE_URL; do
          [ -n "${!v}" ] || missing="$missing $v"
        done
        if [ -n "$missing" ]; then
          echo "::error::Cannot build a signed APK, not configured:$missing (see docs/android-release.md)"; exit 1
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle (wrapper + dependency cache)
      uses: gradle/actions/setup-gradle@v4

    - name: Build the signed release APK
      working-directory: ./client
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        API_BASE_URL: ${{ vars.API_BASE_URL }}
        VERSION_NAME: ${{ steps.version.outputs.name }}
        VERSION_CODE: ${{ steps.version.outputs.code }}
      run: |
        chmod +x gradlew
        # The keystore only ever exists as a file for the length of this step, outside the workspace.
        export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
        echo "$KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
        ./gradlew assembleRelease --stacktrace \
          -PapiBaseUrl="$API_BASE_URL" -PrequireReleaseSigning=true \
          -PappVersionCode="$VERSION_CODE" -PappVersionName="$VERSION_NAME" \
          -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
          -Pkotlin.daemon.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=768m"
        rm -f "$ANDROID_KEYSTORE_FILE"

    - name: Verify the signature and write the checksum
      env:
        VERSION_NAME: ${{ steps.version.outputs.name }}
      run: |
        mkdir -p dist
        apk="dist/sah-collection-vetting-${VERSION_NAME}.apk"
        cp client/app/build/outputs/apk/release/app-release.apk "$apk"
        cp client/app/build/outputs/mapping/release/mapping.txt "dist/mapping-${VERSION_NAME}.txt"
        apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
        "$apksigner" verify --verbose --print-certs "$apk" | tee dist/signature.txt | grep -E "Verifies|SHA-256" || { echo "::error::The APK did not verify"; exit 1; }
        (cd dist && sha256sum "sah-collection-vetting-${VERSION_NAME}.apk" > SHA256SUMS && cat SHA256SUMS)

    - name: Create the GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION_NAME: ${{ steps.version.outputs.name }}
      run: |
        sha="$(cut -d' ' -f1 dist/SHA256SUMS)"
        cat > notes.md <<EOF
        Android APK for SA Harvest Collection & Vetting ${VERSION_NAME}. Install it by opening the file on the phone
        (allow "install unknown apps" for your browser or Files app when asked). It installs over the previous version.

        **SHA-256 of the APK:** \`${sha}\`

        Check it before installing: \`shasum -a 256 sah-collection-vetting-${VERSION_NAME}.apk\`.
        \`mapping-${VERSION_NAME}.txt\` is for developers reading crash traces; staff do not need it.
        EOF
        if gh release view "$TAG" >/dev/null 2>&1; then
          # Re-publishing an existing tag (workflow_dispatch): replace the files, keep the notes the team may have edited.
          gh release upload "$TAG" "dist/sah-collection-vetting-${VERSION_NAME}.apk" "dist/mapping-${VERSION_NAME}.txt" dist/SHA256SUMS dist/signature.txt --clobber
        else
          gh release create "$TAG" "dist/sah-collection-vetting-${VERSION_NAME}.apk" "dist/mapping-${VERSION_NAME}.txt" dist/SHA256SUMS dist/signature.txt \
            --title "SA Harvest Collection & Vetting ${VERSION_NAME}" --notes-file notes.md --verify-tag
        fi
        {
          echo "### Released ${TAG}"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
        } >> "$GITHUB_STEP_SUMMARY"
