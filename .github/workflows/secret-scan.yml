name: Secret scan

# #54: gitleaks looks for committed secrets (API keys, connection strings, signing keys, passwords). GitHub's own secret
# scanning is not available on this private repository. Pull requests and pushes scan only their new commits, so a
# finding points at the change that introduced it; the weekly (and manual) run re-scans the whole history, because a
# secret committed once and removed later is still exposed. Reviewed exceptions live in .gitleaks.toml.
#
# A push to `main` is scanned by deploy.yml, which calls this workflow (workflow_call) as one of the gates before anything
# is deployed; it is not a trigger of its own, or every release would be scanned twice.
on:
  pull_request:
    branches: [ "main", "development" ]
  push:
    branches: [ "development" ]
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # the whole history, not just the tip

    - name: Install gitleaks (pinned version, checksum verified)
      run: |
        base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
        tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        curl -sSfLO "$base/$tarball"
        curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${tarball}\$" | sha256sum -c -
        tar -xzf "$tarball" gitleaks

    # --redact keeps any secret found out of the (shared) workflow log.
    - name: Scan
      env:
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_AFTER: ${{ github.sha }}
      run: |
        range=""
        if [ "$EVENT" = pull_request ]; then range="$PR_BASE..$PR_HEAD"
        elif [ "$EVENT" = push ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then range="$PUSH_BEFORE..$PUSH_AFTER"
        fi
        echo "Scanning ${range:-the whole history}"
        ./gitleaks git --config .gitleaks.toml --redact --verbose ${range:+--log-opts=$range} .
