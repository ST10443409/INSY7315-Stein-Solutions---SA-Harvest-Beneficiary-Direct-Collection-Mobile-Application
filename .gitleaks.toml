# gitleaks configuration (#54): the default rules, plus the exceptions below. Every exception says why it is safe.
# Add one only after checking the finding by hand, and record it in docs/security/security-review.md.

[extend]
useDefault = true

[[allowlists]]
description = "Test code: deliberately fake credentials (ApiFactory's test-only signing key and password, 'leaky-db-password' used to prove nothing leaks, fake tokens)"
paths = [
  '''^api\.Tests/''',
  '''^client/app/src/(test|androidTest|sharedTest)/''',
]

[[allowlists]]
description = "UserSecretsId names the folder dotnet user-secrets uses on each developer's machine; it is not a secret"
regexTarget = "line"
regexes = ['''<UserSecretsId>[0-9a-fA-F-]{36}</UserSecretsId>''']

[[allowlists]]
description = "Placeholders, not values"
regexTarget = "line"
regexes = ['''SET_VIA_USER_SECRETS''', '''<your password>''']

[[allowlists]]
description = "The dev-only SEED_TEST_PASSWORD committed in .env.example by d90c094. It is public and retired: removed and rotated in #54 (see docs/security/security-review.md)"
condition = "AND"
commits = ["d90c094c351b5244fcd3c4795d7dd941e39e2017"]
paths = ['''^\.env\.example$''']

[[allowlists]]
description = "Azure built-in role definition ids in infra/main.bicep: public constants, identical in every tenant (docs: learn.microsoft.com Azure built-in roles), flagged only because the variable names contain the word 'Key' (Key Vault). Not secrets."
regexTarget = "line"
regexes = [
  '''roleKeyVaultSecretsUser = ''',
  '''roleKeyVaultSecretsOfficer = ''',
  '''roleStorageBlobDataContributor = ''',
]

[[allowlists]]
description = "An example image tag in the description of a workflow input in a6f48b9 ('e.g. ghcr.io/owner/saharvest-api:<12 hex characters>'), flagged by the generic-key rule because of its entropy. Not a secret; reworded in a later commit of the same pull request, but an earlier commit still contains it and history is not rewritten for it."
condition = "AND"
commits = ["a6f48b9c8ced8f89defe8f5ff971b03b10052765"]
paths = ['''^\.github/workflows/_deploy-backend\.yml$''']

[[allowlists]]
description = "The Azurite storage emulator's PUBLISHED, fixed development account (devstoreaccount1) and its key, in compose.yaml: Microsoft documents both and they are identical on every machine. They protect nothing: the emulator listens only on the developer's machine, and the API refuses a storage connection string in every environment but Development. Flagged by the generic-key rule only because the key is base64. Matched by its account-name prefix, so any other key is still caught."
regexTarget = "line"
regexes = ['''AccountName=devstoreaccount1;AccountKey=''']
