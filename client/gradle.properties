# Project-wide Gradle settings.

# Gradle daemon JVM. Sized for a 32 GB dev machine; Room/Hilt code generation
# (KSP) plus the Android Gradle Plugin is memory hungry.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Kotlin compiler daemon (also hosts KSP processing).
kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g

# Build speed.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=8

# AndroidX is required by AppCompat / Material / Room.
android.useAndroidX=true
# Per-module R classes: smaller R, faster incremental builds.
android.nonTransitiveRClass=true

kotlin.code.style=official
