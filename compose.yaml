services:
  api:
    build: ./api
    ports:
      - "5064:8080"
    environment:
      # Inside the compose network the simulator is reachable by service name, not localhost.
      ExternalApi__BaseUrl: http://external-api-sim:8080
    depends_on:
      - external-api-sim

  external-api-sim:
    build: ./external-api-sim
    ports:
      - "5284:8080"
