services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saharvest}
      POSTGRES_USER: ${POSTGRES_USER:-saharvest}
      # No default on purpose: copy .env.example to .env and set a password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      # Exposed so host tools (dotnet ef, psql) can reach it, on this machine only (not the LAN). Remove for anything but local dev.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    ports:
      # 5000 is where the Android app (10.0.2.2:5000 from the emulator) expects the API.
      - "5000:8080"
    environment:
      # This file is the LOCAL DEVELOPMENT stack (plain HTTP, seeded test users), so it says so. In any other
      # environment the API requires HTTPS and refuses to start with Seed__Enabled (see api/README.md, "Security").
      ASPNETCORE_ENVIRONMENT: Development
      # Inside the compose network the simulator and database are reachable by service name, not localhost.
      ExternalApi__BaseUrl: http://external-api-sim:8080
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-saharvest};Username=${POSTGRES_USER:-saharvest};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      # Create/update the schema when the container starts (fine for dev; use a deliberate step in production).
      Database__MigrateOnStartup: "true"
      # JWT: the signing key is a secret and has no default on purpose (see .env.example).
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env (see .env.example)}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-60}
      # Foodspace credentials: a SECRET, optional while the simulator (which needs none) stands in for Foodspace.
      Foodspace__ApiKey: ${FOODSPACE_API_KEY:-}
      # Dev only: create one test user per role (cbo_test_user, vetting_test_user, admin_test_user).
      Seed__Enabled: "true"
      Seed__TestUserPassword: ${SEED_TEST_PASSWORD:?Set SEED_TEST_PASSWORD in .env (see .env.example)}
      # Signatures and photos go to the Azurite emulator below, so local development never needs an Azure account. The account name
      # and key are the emulator's PUBLISHED, fixed development credentials (they protect nothing and are the same on every machine);
      # the API refuses a storage connection string in any environment but Development. In Azure it uses Storage__AccountUri and its
      # managed identity instead.
      Storage__ConnectionString: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
    depends_on:
      db:
        condition: service_healthy
      external-api-sim:
        condition: service_started
      azurite:
        condition: service_started

  azurite:
    # The Azure Blob Storage emulator (blob service only). Files live in the azuritedata volume.
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --location /data --skipApiVersionCheck
    ports:
      # This machine only: the emulator accepts its well-known key, so it must not be reachable from the network.
      - "127.0.0.1:10000:10000"
    volumes:
      - azuritedata:/data

  external-api-sim:
    build: ./external-api-sim
    ports:
      # This machine only: the simulator's fault-injection endpoints have no authentication.
      - "127.0.0.1:5284:8080"

volumes:
  pgdata:
  azuritedata:
